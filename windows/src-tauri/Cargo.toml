[package]
name = "windows"
version = "0.1.0"
description = "Windows quota dashboard companion app"
authors = ["GitHub Copilot"]
edition = "2021"

[lib]
name = "windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2.2.1", features = ["tray-icon"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
